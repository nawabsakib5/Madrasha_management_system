{% extends 'base/base.html' %}

{% block title %}Change Password{% endblock %}

{% block content %}
<div>
    <h1>Change Password</h1>

    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="POST" action="{% url 'accounts:change_password' %}">
        {% csrf_token %}

        <div>
            <label for="old_password">পুরনো Password</label>
            <input type="password" id="old_password" name="old_password" required>
        </div>

        <div>
            <label for="new_password">নতুন Password</label>
            <input type="password" id="new_password" name="new_password" required>
        </div>

        <div>
            <label for="confirm_password">নতুন Password নিশ্চিত করুন</label>
            <input type="password" id="confirm_password" name="confirm_password" required>
        </div>

        <div>
            <button type="submit">Password পরিবর্তন করুন</button>
        </div>
    </form>
</div>
{% endblock %}
