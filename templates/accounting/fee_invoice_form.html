{% extends 'base/base.html' %}

{% block title %}{{ action }} Fee Invoice{% endblock %}

{% block content %}
<div>
    <h1>{{ action }} Fee Invoice</h1>
    <a href="{% url 'accounting:fee_invoice_list' %}">Back to List</a>

    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div>
            <label>Student</label>
            <select name="student" required>
                <option value="">-- Select Student --</option>
                {% for student in students %}
                <option value="{{ student.pk }}">{{ student.student_id }} - {{ student.full_name }}</option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label>Fee Category</label>
            <select name="category" required>
                <option value="">-- Select Category --</option>
                {% for category in categories %}
                <option value="{{ category.pk }}">{{ category.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label>Amount (৳)</label>
            <input type="number" name="amount" step="0.01" required>
        </div>

        <div>
            <label>Due Date</label>
            <input type="date" name="due_date" required>
        </div>

        <div>
            <label>Month (optional)</label>
            <select name="month">
                <option value="">-- Select Month --</option>
                <option value="1">January</option>
                <option value="2">February</option>
                <option value="3">March</option>
                <option value="4">April</option>
                <option value="5">May</option>
                <option value="6">June</option>
                <option value="7">July</option>
                <option value="8">August</option>
                <option value="9">September</option>
                <option value="10">October</option>
                <option value="11">November</option>
                <option value="12">December</option>
            </select>
        </div>

        <div>
            <label>Year (optional)</label>
            <input type="number" name="year" min="2000" max="2100">
        </div>

        <div>
            <button type="submit">{{ action }} Invoice</button>
        </div>
    </form>
</div>
{% endblock %}
