{% extends 'base/base.html' %}

{% block title %}{{ action }} Fee Category{% endblock %}

{% block content %}
<div>
    <h1>{{ action }} Fee Category</h1>
    <a href="{% url 'accounting:fee_category_list' %}">Back to List</a>

    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div>
            <label>Category Name</label>
            <input type="text" name="name" required>
        </div>

        <div>
            <label>Description</label>
            <textarea name="description"></textarea>
        </div>

        <div>
            <button type="submit">{{ action }} Category</button>
        </div>
    </form>
</div>
{% endblock %}
